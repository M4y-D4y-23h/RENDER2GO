[project]
name = "gpu2go-worker"
version = "0.1.0"
description = "Worker do GPU2GO: compila o pedido, preenche o template do ComfyUI e devolve o vídeo"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.7",
]

[project.scripts]
gpu2go-submit = "gpu2go_worker.cli_submit:main"
gpu2go-fetch-models = "gpu2go_worker.models:main"
gpu2go-validate-template = "gpu2go_worker.template:main"
gpu2go-eval-compiler = "gpu2go_worker.cli_eval:main"
gpu2go-experiment = "gpu2go_worker.experiment:main"
gpu2go-video = "gpu2go_worker.video:main"
gpu2go-runpod = "gpu2go_worker.runpod_pods:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu2go_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
