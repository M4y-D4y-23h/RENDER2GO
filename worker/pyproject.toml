[project]
name = "render2go-worker"
version = "0.1.0"
description = "Worker do Render2Go: compila o pedido, preenche o template do ComfyUI e devolve o vídeo"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.7",
    "pillow>=10",
]

[project.scripts]
render2go-submit = "render2go_worker.cli_submit:main"
render2go-fetch-models = "render2go_worker.models:main"
render2go-validate-template = "render2go_worker.template:main"
render2go-eval-compiler = "render2go_worker.cli_eval:main"
render2go-experiment = "render2go_worker.experiment:main"
render2go-video = "render2go_worker.video:main"
render2go-runpod = "render2go_worker.runpod_pods:main"
render2go-lote = "render2go_worker.lote:main"
render2go-lote-nuvem = "render2go_worker.lote_nuvem:main"
render2go-acabamento = "render2go_worker.acabamento:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render2go_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
