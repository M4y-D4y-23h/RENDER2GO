<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Render2Go · Suporte</title>
  <link rel="stylesheet" href="/estilo.css">
  <script src="/app.js" defer></script>
</head>
<body data-pagina="suporte">
  <header>
    <h1>Render2Go · suporte</h1>
    <a class="botao-link" href="/">Voltar para os pedidos</a>
  </header>
  <main>
    <form id="form-suporte">
      <p class="fraco">Dúvida, problema com um pedido ou com o código de acesso? Escreva aqui. Respondemos pelo e-mail que você informar.</p>
      <p id="suporte-conta" class="aviso info" hidden></p>
      <label for="suporte-assunto">Assunto (opcional)</label>
      <input id="suporte-assunto" maxlength="120">
      <label for="suporte-mensagem">Mensagem</label>
      <textarea id="suporte-mensagem" required minlength="10" maxlength="2000"></textarea>
      <label for="suporte-email">Seu e-mail para resposta</label>
      <input id="suporte-email" type="email" maxlength="200" autocomplete="email">
      <button type="submit" id="suporte-enviar">Enviar mensagem</button>
      <p id="suporte-msg" class="aviso" hidden></p>
    </form>
  </main>
  <footer><button type="button" class="link" id="preferencias-cookies">Preferências de cookies</button></footer>
</body>
</html>
