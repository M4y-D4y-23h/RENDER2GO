[project]
name = "gpu2go-servico"
version = "0.1.0"
description = "Serviço do GPU2GO: API dos lotes, fila, armazenamento (R2) e orquestrador de pods"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "psycopg[binary]==3.2.10",
    "gpu2go-worker",
]

[project.scripts]
gpu2go-servico = "gpu2go_servico.cli:main"

[tool.uv.sources]
gpu2go-worker = { path = "../worker", editable = true }

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.3", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu2go_servico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
