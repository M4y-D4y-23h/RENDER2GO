[project]
name = "render2go-servico"
version = "0.1.0"
description = "Serviço do Render2Go: API dos lotes, fila, armazenamento (R2) e orquestrador de pods"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "psycopg[binary]==3.2.10",
    "psycopg-pool==3.2.8",  # conexões reaproveitadas (antes: uma conexão nova por transação)
    "opencv-python-headless==4.12.0.88",  # aviso de pessoas no /aprovar (pessoas.py)
    # segredos do aplicativo autenticador cifrados no banco (AES-GCM): clientes e acessos do painel
    "cryptography==50.0.2",
    "segno==1.6.6",  # QR Code (SVG) do aplicativo autenticador, gerado no servidor
    "render2go-worker",
]

[project.optional-dependencies]
# filtro das fotos no servidor (ADR 0005, render2go_servico.filtro_fotos): o mesmo classificador dos pods
# (render2go_worker.filtro_imagem), em CPU, nas versões dos pods (worker/requirements.lock). Só na imagem
# (uv sync --extra filtro, no Dockerfile): os testes usam um classificador falso
filtro = ["torch==2.8.0", "torchvision==0.23.0", "timm==1.0.30", "safetensors==0.8.0"]

[project.scripts]
render2go-servico = "render2go_servico.cli:main"

[tool.uv.sources]
render2go-worker = { path = "../worker", editable = true }
# PyTorch só de CPU (o servidor não tem GPU): o índice oficial, sem as bibliotecas CUDA do PyPI
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.3", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render2go_servico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120  # SQL longo em uma linha é mais legível
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# padrão do FastAPI: Depends/Header nos parâmetros
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
