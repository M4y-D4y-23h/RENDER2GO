name: worker

on:
  push:
    paths:
      - "worker/**"
      - "tools/**"
      - "referencia/**"
      - "infra/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - "tools/**"
      - "referencia/**"
      - "infra/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: ffmpeg (testes de continuar vídeo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --python 3.12
      - run: uv run ruff check . ../tools
      - run: uv run ruff format --check . ../tools
      - run: uv run pytest -q
      - name: Template derivado em dia com o export de referência
        run: uv run python ../tools/derive_i2v_template.py --check
      - name: Templates T2V candidatos em dia com o I2V
        run: uv run python ../tools/build_t2v_templates.py --check
      - name: Template I2V candidato dos modelos oficiais em dia (ADR 0014)
        run: uv run python ../tools/build_i2v_templates.py --check
      - name: Dockerfiles da integração GitHub do RunPod em dia
        run: uv run python ../tools/build_runpod_dockerfiles.py --check

  build-slim:
    # Sem GPU: confere que a imagem monta, que o ComfyUI importa os nós, que o patch UMT5
    # carrega e que o template valida contra o /object_info do ComfyUI v0.38.0.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Liberar disco (a imagem slim tem ~18 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build do alvo slim (sem o modelo do compilador)
        run: >
          docker buildx build
          --file worker/Dockerfile
          --target slim
          --build-arg WITH_COMPILER_MODEL=0
          --output type=cacheonly
          worker
      - name: Build do alvo bakeoff (ComfyUI-GGUF; valida os templates T2V candidatos)
        run: >
          docker buildx build
          --file worker/Dockerfile
          --target bakeoff
          --build-arg WITH_COMPILER_MODEL=0
          --output type=cacheonly
          worker
