name: servico

on:
  push:
    paths:
      - "servico/**"
      - "worker/**"
      - "tools/**"
      - ".github/workflows/servico.yml"
  pull_request:
    paths:
      - "servico/**"
      - "worker/**"
      - "tools/**"
      - ".github/workflows/servico.yml"
  workflow_dispatch:

concurrency:
  group: servico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: render2go_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RENDER2GO_TESTE_PG: postgresql://postgres:postgres@localhost:5432/render2go_teste
    defaults:
      run:
        working-directory: servico
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: ffmpeg (conferência do 1º quadro e worker da fila)
        # apt às vezes trava no runner: tempo limite e até 3 tentativas
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -qq -o Acquire::Retries=3 \
              && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg && exit 0
            echo "apt falhou (tentativa $i)"; sleep 10
          done
          exit 1
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Testes (SQLite e Postgres)
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: axe-core (acessibilidade nas páginas)
        working-directory: servico/web
        run: npm ci
      - name: Páginas no Chromium (playwright e axe-core)
        run: |
          uv run --with playwright==1.56.0 playwright install --with-deps chromium
          uv run --with playwright==1.56.0 pytest -q tests/test_paginas.py tests/test_paginas_conta.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: servico/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: publico/ em dia com src/ (TypeScript, CSS e HTML minificados, versões e SRI)
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- publico)" ]; then
            git status --short -- publico
            echo "::error::publico/ desatualizado: rode 'npm run build' em servico/web e versione o resultado"
            exit 1
          fi

  imagem:
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem do serviço
        run: docker buildx build --file servico/Dockerfile --output type=cacheonly .
